<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBShell — Interactive Music Environment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/tomorrow-night.min.css">
  <style>
    :root {
      --bg:        #0a0a0a;
      --surface:   #111111;
      --border:    #1e1e1e;
      --green:     #00ff87;
      --orange:    #ff5f00;
      --blue:      #00d7ff;
      --mauve:     #af5fff;
      --pink:      #ffafdf;
      --yellow:    #ffff00;
      --white:     #e0e0e0;
      --dim:       #555;
      --font:      'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.7;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .prompt {
      color: var(--green);
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    .prompt .cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background: var(--green);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .site-title {
      color: var(--white);
      font-size: 18px;
      font-weight: 500;
    }

    .site-sub {
      color: var(--dim);
      font-size: 12px;
      margin-left: auto;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* ── Sidebar ── */
    nav {
      width: 240px;
      flex-shrink: 0;
      position: sticky;
      top: 53px;
      height: calc(100vh - 53px);
      overflow-y: auto;
      padding: 24px 16px;
      border-right: 1px solid var(--border);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    nav::-webkit-scrollbar { width: 4px; }
    nav::-webkit-scrollbar-thumb { background: var(--border); }

    .nav-section {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--dim);
      text-transform: uppercase;
      margin: 20px 0 6px;
    }

    nav a {
      display: block;
      color: var(--dim);
      text-decoration: none;
      font-size: 12px;
      padding: 3px 8px;
      border-left: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    nav a:hover, nav a.active {
      color: var(--green);
      border-left-color: var(--green);
    }

    nav a.h2 { padding-left: 8px; font-weight: 500; color: #888; }
    nav a.h3 { padding-left: 18px; font-size: 11px; }

    nav a.h2:hover, nav a.h2.active { color: var(--green); }
    nav a.h3:hover, nav a.h3.active { color: var(--green); }

    /* ── Main content ── */
    main {
      flex: 1;
      min-width: 0;
      padding: 40px 48px 80px;
    }

    /* ── Typography ── */
    main h1 {
      color: var(--green);
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    main h2 {
      color: var(--green);
      font-size: 20px;
      font-weight: 600;
      margin: 48px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    main h3 {
      color: var(--orange);
      font-size: 15px;
      font-weight: 600;
      margin: 28px 0 12px;
    }

    main h4 {
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      margin: 20px 0 8px;
    }

    main p {
      margin-bottom: 14px;
      color: var(--white);
    }

    main a {
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    main a:hover { border-bottom-color: var(--blue); }

    main ul, main ol {
      margin: 8px 0 14px 20px;
    }
    main li { margin-bottom: 4px; }

    main strong { color: var(--yellow); font-weight: 600; }
    main em { color: var(--pink); font-style: normal; font-weight: 500; }

    main hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 36px 0;
    }

    /* ── Inline code ── */
    main :not(pre) > code {
      background: #1a1a1a;
      color: var(--blue);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 13px;
      border: 1px solid var(--border);
    }

    /* ── Code blocks ── */
    main pre {
      background: #0e0e0e;
      border: 1px solid var(--border);
      border-left: 3px solid var(--green);
      border-radius: 4px;
      padding: 16px 20px;
      margin: 12px 0 20px;
      overflow-x: auto;
      position: relative;
    }

    main pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--white);
    }

    /* prompt lines in code blocks */
    main pre code .line-prompt::before {
      content: 'SB#> ';
      color: var(--green);
    }

    /* ── Blockquote (used for dialogue \/ lines) ── */
    main blockquote {
      border-left: 3px solid var(--mauve);
      padding: 8px 16px;
      margin: 12px 0;
      color: var(--pink);
      font-style: italic;
      background: #111118;
    }

    /* ── Images ── */
    main img {
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 4px;
      margin: 12px 0;
      display: block;
    }

    /* ── Tables ── */
    main table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
    }

    main th {
      background: var(--surface);
      color: var(--green);
      padding: 8px 12px;
      text-align: left;
      border: 1px solid var(--border);
    }

    main td {
      padding: 7px 12px;
      border: 1px solid var(--border);
    }

    main tr:nth-child(even) td { background: #0d0d0d; }

    /* ── Footer ── */
    footer {
      text-align: center;
      color: var(--dim);
      font-size: 11px;
      padding: 20px;
      border-top: 1px solid var(--border);
    }

    footer span { color: var(--green); }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      nav { display: none; }
      main { padding: 24px 20px 60px; }
      header { padding: 12px 20px; }
      .site-sub { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="prompt">SB#&gt;<span class="cursor"></span></div>
  <div class="site-title">SBShell</div>
  <div class="site-sub">Interactive Music Environment — User Guide</div>
</header>

<div class="layout">
  <nav id="toc"></nav>
  <main id="content"></main>
</div>

<footer>
  <span>SBShell</span> — built with Slang &amp; C++
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  // Configure marked
  marked.setOptions({
    highlight: (code, lang) => {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      // Treat unlabelled blocks as javascript
      return hljs.highlight(code, { language: 'javascript' }).value;
    },
    breaks: false,
    gfm: true,
  });

  // Load and render the guide
  fetch('guide.md')
    .then(r => r.text())
    .then(md => {
      document.getElementById('content').innerHTML = marked.parse(md);
      buildTOC();
      hljs.highlightAll();
      highlightPromptLines();
    })
    .catch(() => {
      document.getElementById('content').innerHTML =
        '<p style="color:#ff5f00">Could not load guide.md</p>';
    });

  // Build sidebar table of contents
  function buildTOC() {
    const toc = document.getElementById('toc');
    const headings = document.querySelectorAll('#content h1, #content h2, #content h3');

    headings.forEach((h, i) => {
      if (!h.id) h.id = 'h-' + i;

      // Section label for h1
      if (h.tagName === 'H1') {
        const label = document.createElement('div');
        label.className = 'nav-section';
        label.textContent = h.textContent;
        toc.appendChild(label);
        return;
      }

      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = h.tagName.toLowerCase();
      toc.appendChild(a);
    });

    // Highlight active section on scroll
    const links = toc.querySelectorAll('a');
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          links.forEach(l => l.classList.remove('active'));
          const active = toc.querySelector(`a[href="#${e.target.id}"]`);
          if (active) {
            active.classList.add('active');
            active.scrollIntoView({ block: 'nearest' });
          }
        }
      });
    }, { rootMargin: '-10% 0px -80% 0px' });

    headings.forEach(h => obs.observe(h));
  }

  // Colour SB#> prompt lines in code blocks
  function highlightPromptLines() {
    document.querySelectorAll('pre code').forEach(block => {
      block.innerHTML = block.innerHTML
        .split('\n')
        .map(line => line.startsWith('SB#&gt;') || line.startsWith('SB#>')
          ? `<span style="color:var(--green)">${line}</span>`
          : line)
        .join('\n');
    });
  }
</script>

</body>
</html>
